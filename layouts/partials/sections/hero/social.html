<span class="hero-social">
    {{ range .Site.Params.hero.socialLinks.fontAwesomeIcons }}
    <span class="px-1">
        <a href="{{ .url }}"
            {{- if not (or (hasPrefix .url "#") (hasPrefix .url "mailto:")) }} target="_blank" rel="noopener"{{ end }}
            class="btn social-icon"
            aria-label="{{ .label | default .url }}"
        >
            <i class="{{ .icon }}" aria-hidden="true"></i>
        </a>
    </span>
    {{ end }}

    {{ range .Site.Params.hero.socialLinks.customIcons }}
    <span class="px-1">
        <a href="{{ .url }}"
            {{- if not (or (hasPrefix .url "#") (hasPrefix .url "mailto:")) }} target="_blank" rel="noopener"{{ end }}
            class="btn social-icon"
            aria-label="{{ .label | default .url }}"
        >
            <img src="{{ .icon }}" alt="">
        </a>
    </span>
    {{ end }}
</span>
