<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" width="720" height="610" role="img" aria-label="The program as three layers, top to bottom. Files come in through a checking layer using Pydantic that stops bad data. The middle is pure functions passing dataclasses, with no files and no clock. The report is written at the bottom edge">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="{{ .accent }}"/>
    </marker>
  </defs>
  <rect width="720" height="610" fill="{{ .page }}"/>
  <g font-family="ui-monospace, Cascadia Code, Consolas, Menlo, monospace" font-size="19" fill="{{ .text }}" text-anchor="middle">
    <rect x="110" y="20" width="220" height="48" rx="8" fill="{{ .page }}" stroke="{{ .border }}" stroke-width="1.5"/>
    <text x="220" y="51">fees.yaml</text>
    <rect x="390" y="20" width="220" height="48" rx="8" fill="{{ .page }}" stroke="{{ .border }}" stroke-width="1.5"/>
    <text x="500" y="51">invoices.csv</text>
  </g>
  <g fill="none" stroke="{{ .accent }}" stroke-width="2">
    <path d="M220 68 V100" marker-end="url(#arrow)"/>
    <path d="M500 68 V100" marker-end="url(#arrow)"/>
    <path d="M360 186 V218" marker-end="url(#arrow)"/>
    <path d="M360 472 V504" marker-end="url(#arrow)"/>
  </g>

  <rect x="40" y="104" width="640" height="82" rx="10" fill="{{ .card }}" stroke="{{ .accent }}" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="360" y="138" font-size="21" font-weight="700" fill="{{ .text }}">The edge: Pydantic checks what comes in</text>
    <text x="360" y="166" font-size="17" fill="{{ .secondary }}">A wrong rate or a bad date stops here, with a clear message</text>
  </g>

  <rect x="40" y="222" width="640" height="250" rx="10" fill="{{ .card }}" stroke="{{ .border }}" stroke-width="1.5"/>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="360" y="258" font-size="21" font-weight="700" fill="{{ .text }}">The core: pure functions and dataclasses</text>
    <text x="360" y="286" font-size="17" fill="{{ .secondary }}">No files, no clock. Same input, same answer. Easy to test.</text>
  </g>
  <g font-family="ui-monospace, Cascadia Code, Consolas, Menlo, monospace" font-size="19" fill="{{ .text }}" text-anchor="middle">
    <rect x="70" y="312" width="260" height="46" rx="8" fill="{{ .page }}" stroke="{{ .border }}"/>
    <text x="200" y="342">count_days_late</text>
    <rect x="390" y="312" width="260" height="46" rx="8" fill="{{ .page }}" stroke="{{ .border }}"/>
    <text x="520" y="342">calculate_fee</text>
    <rect x="70" y="400" width="260" height="46" rx="8" fill="{{ .page }}" stroke="{{ .border }}"/>
    <text x="200" y="430">find_late_fees</text>
    <rect x="390" y="400" width="260" height="46" rx="8" fill="{{ .page }}" stroke="{{ .border }}"/>
    <text x="520" y="430">format_report</text>
  </g>
  <g fill="none" stroke="{{ .accent }}" stroke-width="2">
    <path d="M200 358 V396" marker-end="url(#arrow)"/>
    <path d="M430 358 L300 396" marker-end="url(#arrow)"/>
    <path d="M330 423 H386" marker-end="url(#arrow)"/>
  </g>

  <rect x="40" y="508" width="640" height="82" rx="10" fill="{{ .card }}" stroke="{{ .accent }}" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="360" y="542" font-size="21" font-weight="700" fill="{{ .text }}">The edge: write the report</text>
    <text x="360" y="570" font-size="17" fill="{{ .secondary }}">The one place this program changes anything outside itself</text>
  </g>
</svg>
