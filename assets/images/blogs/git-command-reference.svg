<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A Git branch graph: a main line of commits with a feature branch that splits off and merges back">
  <rect width="1200" height="630" fill="{{ .card }}"/>
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M140 400 H1060" stroke="{{ .muted }}"/>
    <path d="M340 400 C 400 400, 400 240, 460 240 H 760 C 820 240, 820 400, 880 400" stroke="#f05033"/>
  </g>
  <g stroke="{{ .card }}" stroke-width="8">
    <circle cx="140" cy="400" r="26" fill="{{ .muted }}"/>
    <circle cx="340" cy="400" r="26" fill="{{ .muted }}"/>
    <circle cx="600" cy="400" r="26" fill="{{ .muted }}"/>
    <circle cx="880" cy="400" r="30" fill="{{ .text }}"/>
    <circle cx="1060" cy="400" r="26" fill="{{ .muted }}"/>
    <circle cx="460" cy="240" r="26" fill="#f05033"/>
    <circle cx="610" cy="240" r="26" fill="#f05033"/>
    <circle cx="760" cy="240" r="26" fill="#f05033"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="{{ .text }}">
    <text x="140" y="490">main</text>
    <text x="460" y="180">feature</text>
    <text x="830" y="490">merge</text>
  </g>
</svg>
