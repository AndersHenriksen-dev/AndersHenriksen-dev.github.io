<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Searching for fees in an editor finds three files. Lined up, their paths share the same subfolder billing: fees.py under lib holds the code, fees.yaml under config holds the values, and test_fees.py under tests holds the tests">
  <rect width="720" height="400" fill="{{ .page }}"/>
  <rect x="20" y="20" width="680" height="360" rx="14" fill="{{ .card }}" stroke="{{ .border }}" stroke-width="1.5"/>
  <rect x="44" y="44" width="632" height="52" rx="8" fill="{{ .page }}" stroke="{{ .accent }}" stroke-width="2"/>
  <text x="62" y="78" font-family="ui-monospace, Cascadia Code, Consolas, Menlo, monospace" font-size="21" fill="{{ .text }}">fees</text>
  <text x="658" y="77" text-anchor="end" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="{{ .secondary }}">search by file name: 3 results</text>

  <rect x="290" y="116" width="118" height="248" rx="8" fill="{{ .accent }}" fill-opacity="0.14"/>
  <text x="349" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="{{ .secondary }}">same folder</text>

  <g font-family="ui-monospace, Cascadia Code, Consolas, Menlo, monospace" font-size="20">
    <g fill="{{ .secondary }}" text-anchor="end">
      <text x="284" y="190">src/latefees/lib/</text>
      <text x="284" y="266">src/latefees/config/</text>
      <text x="284" y="342">tests/</text>
    </g>
    <g fill="{{ .text }}">
      <text x="349" y="190" text-anchor="middle">billing/</text>
      <text x="349" y="266" text-anchor="middle">billing/</text>
      <text x="349" y="342" text-anchor="middle">billing/</text>
    </g>
    <g fill="{{ .text }}" font-weight="700">
      <text x="420" y="190">fees.py</text>
      <text x="420" y="266">fees.yaml</text>
      <text x="420" y="342">test_fees.py</text>
    </g>
  </g>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="{{ .secondary }}">
    <text x="420" y="214">what it does</text>
    <text x="420" y="290">what you can change</text>
    <text x="420" y="366">what has been checked</text>
  </g>
</svg>
