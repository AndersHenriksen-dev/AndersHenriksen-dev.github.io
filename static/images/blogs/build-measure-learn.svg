<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="A loop of three steps, using my SAS to Python agent as the example. Build: the smallest version that works, one script moved to Python. Measure: talk to the people using it, who found the classes frustrating to read. Learn: what you could not have guessed, that the code has to read from top to bottom like SAS. An arrow leads back to Build, and the loop repeats">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#81a8d6"/>
    </marker>
  </defs>
  <rect width="720" height="540" fill="#0d1114"/>

  <rect x="180" y="20" width="360" height="160" rx="12" fill="#1b2129" stroke="#81a8d6" stroke-width="2.5"/>
  <rect x="384" y="330" width="316" height="190" rx="12" fill="#1b2129" stroke="#3a4656" stroke-width="1.5"/>
  <rect x="20" y="330" width="316" height="190" rx="12" fill="#1b2129" stroke="#3a4656" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" fill="#e4eaf2">
    <text x="204" y="56" font-size="18" fill="#a7b3c2">BUILD</text>
    <text x="204" y="90" font-size="25" font-weight="700">The smallest version</text>
    <text x="204" y="118" font-size="25" font-weight="700">that works</text>
    <text x="204" y="154" font-size="20">One script moved to Python</text>

    <text x="406" y="366" font-size="18" fill="#a7b3c2">MEASURE</text>
    <text x="406" y="400" font-size="25" font-weight="700">Talk to the people</text>
    <text x="406" y="428" font-size="25" font-weight="700">using it</text>
    <text x="406" y="466" font-size="20">They found the classes</text>
    <text x="406" y="492" font-size="20">frustrating to read</text>

    <text x="42" y="366" font-size="18" fill="#a7b3c2">LEARN</text>
    <text x="42" y="400" font-size="25" font-weight="700">What you could</text>
    <text x="42" y="428" font-size="25" font-weight="700">not have guessed</text>
    <text x="42" y="466" font-size="20">It has to read from top to</text>
    <text x="42" y="492" font-size="20">bottom, like the old SAS</text>

    <text x="360" y="256" font-size="20" fill="#a7b3c2" text-anchor="middle">then go again</text>
  </g>

  <g fill="none" stroke="#81a8d6" stroke-width="2.5">
    <path d="M540 100 C620 100 640 220 620 324" marker-end="url(#arrow)"/>
    <path d="M384 425 H342" marker-end="url(#arrow)"/>
    <path d="M100 330 C80 220 100 100 174 100" marker-end="url(#arrow)"/>
  </g>
</svg>
