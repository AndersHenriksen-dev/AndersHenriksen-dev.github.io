baseURL: "https://andershenriksen-dev.github.io/"
locale: "en-us"
title: "Anders Henriksen"

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 6

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog posts
      url: /blogs
      weight: 1

params:
  title: "Anders Henriksen"
  description: "Anders Henriksen builds AI agents, retrieval systems and data pipelines in Copenhagen, and writes about what he learns."
  favicon: "/fav.png"

  # Serve the bundled Bootstrap files instead of a CDN.
  useBootstrapCDN: false

  mathjax: false
  animate: true

  # Always dark, with no light/dark toggle in the navbar.
  theme:
    defaultTheme: "dark"
    disableThemeToggle: true

  navbar:
    align: ms-auto
    brandName: "Anders Henriksen"
    disableSearch: false
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: true
      disableContact: false

  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Anders Henriksen."
    subtitle: "I build AI agents and data systems for finance teams."
    content: "I hold a Master's in Artificial Intelligence from DTU and work in Copenhagen. I build agentic AI workflows, retrieval systems and data pipelines, measure whether they work, and teach the people around me to use them."
    image: /images/me.jpg
    roundImage: true
    bottomImage:
      enable: true
    button:
      enable: true
      name: "See my projects"
      url: "#projects"
      download: false
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/AndersHenriksen-dev
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/andershenriksen/
        - icon: fa fa-envelope
          url: mailto:anhenr.dev@gmail.com

  about:
    enable: true
    title: "About Me"
    content: |-
      I am often the most technical person in a finance team, and I use that to make the whole team faster. I find the manual work, automate it, and teach my colleagues the tools so the change lasts. I have built or used AI models in every job I have had.

      I care about clean code, tests and version control. In every team I have joined, I have moved the work into Git and set up the practices that let several people change the same code safely. I like turning vague requirements into small, clear tasks that a team can share.

      This site is where I write up my projects and what I learned from them. Each project page links to its code on GitHub.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "Python"
        - "SQL"
        - "Agentic AI and MCP servers"
        - "Retrieval-augmented generation (RAG)"
        - "LLM evaluation"
        - "GitHub Copilot and Claude"
        - "Git, GitHub and GitHub Actions"
        - "Docker"
        - "AWS and Azure"
        - "Power Automate and Power Apps"
        - "PyTorch and scikit-learn"
        - "dbt, DuckDB and Hydra"

  experience:
    enable: true
    items:
      - company: "Capital Four"
        companyUrl: "https://www.capital-four.com"
        jobs:
          - name: "Senior Data Analyst"
            date: "Jun 2026 - present"
            info:
              content: "Credit investment manager in Copenhagen"
            content: |
              - Leading the team's move to Git, GitHub and VS Code as the single source of truth. ISAE 3402 audit reporting now starts from one page.
              - Teaching colleagues to use AI assistants safely: when to plan, where to check the output, and which model to use for which task.
              - Built agentic AI workflows in GitHub Copilot that write change documentation from the issue, the branch and the code changes, which used to be written by hand.
              - Led a security audit of the company's 77 repositories and designed the security setup for GitHub Enterprise.
              - Built a Microsoft Teams button with Power Automate that activates and deactivates users in the portfolio management system, a manual task done 5 to 10 times a day.

      - company: "Danske Bank"
        companyUrl: "https://danskebank.com"
        jobs:
          - name: "Data Analyst (Tech Lead), Group Treasury"
            date: "Mar 2026 - May 2026"
            content: |
              - Trained 45+ non-technical colleagues in Git, VS Code, Python and AI tools, and made them part of the department's daily work.
              - Built a closed-loop agent workflow in GitHub Copilot that migrates legacy SAS code to Python. It fetches test data, checks that the outputs match and flags data drift.
              - Primary technical contact for Cover Pool Management: turned market risk, liquidity and debt issuance requirements into programming tasks.
          - name: "Data Scientist, Portfolio Intelligence"
            date: "Apr 2025 - Mar 2026"
            content: |
              - Co-owned the migration of the bank's IFRS9 Expected Credit Loss and credit portfolio stress test models to Python on AWS, and cut their run time by 80%.
              - Ran what-if analyses on inflation, interest rates and housing prices for the bank's risk tolerance.
              - Presented ECL results to auditors, regulators and non-technical stakeholders.
              - Taught the team GitHub Copilot, modern Python and Git practices.

      - company: "Novo Nordisk"
        companyUrl: "https://www.novonordisk.com"
        jobs:
          - name: "Data Scientist (Student Helper), R&D"
            date: "Dec 2021 - Oct 2024"
            content: |
              - Built reproducible analysis workflows in Python for large R&D data sets used by cross-functional teams.
              - Taught the team Git, version control and deployment practices, which cut errors by 30%.
              - Wrote my master's thesis in collaboration with Novo Nordisk (see Education).

      - company: "Absis ApS"
        jobs:
          - name: "Co-founder"
            date: "2020 - 2021"
            content: |
              - Built an OCR pipeline in Python that extracts data from financial documents.

  education:
    enable: true
    index: false
    items:
      - title: "MSc Human-Centered Artificial Intelligence"
        school:
          name: "Technical University of Denmark (DTU)"
          url: "https://www.dtu.dk"
        date: "2024"
        GPA: "11.3 out of 12.0"
        content: |-
          Thesis with Novo Nordisk (grade 12): forecasting whether people with sickle cell disease will have a vaso-occlusive crisis the next day, from questionnaires, biometrics, weather and location data. AUC of 0.98, built as a production-ready model with CI/CD.

          Relevant courses: Machine Learning Operations, Time Series Analysis, User Experience in Data Science.
      - title: "BSc Artificial Intelligence and Data"
        school:
          name: "Technical University of Denmark (DTU)"
          url: "https://www.dtu.dk"
        date: "2022"
        GPA: "10.7 out of 12.0"
        content: |-
          Bachelor project (grade 12): a CycleGAN that removes field strength bias in an MRI-based Alzheimer's disease classifier.

          Relevant courses: Algorithms and Data Structures, Software Engineering, Probability and Statistics, Database Engineering, Deep Learning.

  achievements:
    enable: false

  # Project cards come from the pages in content/projects/.
  projects:
    enable: true
    title: "Projects"

  contact:
    enable: true
    content: "My inbox is always open. Whether you have a question about one of my projects or just want to say hi, I will get back to you."
    btnName: "Mail me"
    btnLink: "mailto:anhenr.dev@gmail.com"

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: "Recent Posts"
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/AndersHenriksen-dev
      linkedin: https://www.linkedin.com/in/andershenriksen/

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: false

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
