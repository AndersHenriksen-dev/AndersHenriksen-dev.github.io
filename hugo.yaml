baseURL: "https://andershenriksen-dev.github.io/"
locale: "en-US"
title: "Anders Henriksen"

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"

taxonomies:
  tag: tags

enableRobotsTXT: true

pagination:
  pagerSize: 6

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog posts
      url: /blogs/
      weight: 1

params:
  title: "Anders Henriksen"
  description: "Anders Henriksen builds AI agents, retrieval systems and data pipelines in Copenhagen, and writes about what he learns."
  favicon: "/fav.png"
  # Share image for pages without their own `images` in front matter.
  images:
    - "/images/me.jpg"
  copyright: "Anders Henriksen."

  # static/style.css: the site's own overrides, loaded after the theme's CSS.
  customCSS: true

  color:
    # The one color the whole palette is built from: pick any color, black and
    # white included. It gives the hue and saturation; every role (page, cards,
    # text, links, buttons) keeps a fixed HSV value, so all of them stay readable.
    # The roles and their contrast are listed at the top of static/style.css.
    base: "#3b74b8"
    # The same palette as fixed colors, for browsers without CSS relative colors.
    darkmode:
      backgroundColor: "#0d1114"
      secondaryBackgroundColor: "#1b2129"
      secondaryColor: "#1b2129"
      textColor: "#e4eaf2"
      secondaryTextColor: "#a7b3c2"
      textLinkColor: "#81a8d6"
      primaryColor: "#81a8d6"

  # Serve the bundled Bootstrap files instead of a CDN.
  useBootstrapCDN: false

  mathjax: false
  animate: true

  # Always dark, with no light/dark toggle in the navbar.
  theme:
    defaultTheme: "dark"
    disableThemeToggle: true

  navbar:
    align: ms-auto
    brandName: "Anders Henriksen"
    disableSearch: false
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: true
      disableContact: false

  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Anders Henriksen."
    subtitle: "I help finance teams adopt AI, and build the agents and data systems behind it."
    content: "Senior Data Analyst at Capital Four in Copenhagen, and before that Danske Bank. I hold a Master's in Artificial Intelligence from DTU. I have trained 45+ colleagues in Git and AI tools, and I measure the AI systems I build against a test set."
    image: /images/me.jpg
    roundImage: true
    bottomImage:
      enable: true
    button:
      enable: true
      name: "See my projects"
      url: "#projects"
      download: false
      newPage: false
    # Shown only when the file exists under static/.
    cvButton:
      enable: true
      name: "Download CV"
      url: "cv/Anders_Henriksen_CV.pdf"
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          label: "GitHub"
          url: https://github.com/AndersHenriksen-dev
        - icon: fab fa-linkedin
          label: "LinkedIn"
          url: https://www.linkedin.com/in/andershenriksen/
        - icon: fa fa-envelope
          label: "Email"
          url: mailto:anhenr.dev@gmail.com

  about:
    enable: true
    title: "About Me"
    content: |-
      I work where finance and technology meet. I find the manual work in a team, automate it, and train my colleagues so the change lasts.

      In my last four teams I have taught Git and version control, and set up the practices that let several people change the same code safely. I like turning vague requirements into small, clear tasks that a team can share.

      I work in Danish and English. This site is where I write up my projects and what I learned from them, each with a link to its code.
    skills:
      enable: true
      title: "What I work with:"
      items:
        - "Python"
        - "SQL"
        - "Agentic AI and MCP servers"
        - "Retrieval-augmented generation (RAG)"
        - "LLM evaluation"
        - "GitHub Copilot and Claude"
        - "Git, GitHub and GitHub Actions"
        - "Docker"
        - "AWS and Azure"
        - "Power Automate and Power Apps"
        - "dbt, DuckDB and Hydra"

  experience:
    enable: true
    items:
      - company: "Capital Four"
        companyUrl: "https://www.capital-four.com"
        jobs:
          - name: "Senior Data Analyst"
            date: "Jun 2026 - present"
            info:
              content: "Credit investment manager in Copenhagen"
            content: |
              - Teaching colleagues to use AI assistants safely: when to plan, where to check the output, and which model to use for which task.
              - Leading the team's move to Git, GitHub and VS Code as the single source of truth. ISAE 3402 audits and change management now start from one place.
              - Led a security audit of the company's 77 repositories and designed the security setup for GitHub Enterprise.
              - Built agentic AI workflows in GitHub Copilot that write change documentation from the issue, the branch and the code changes. It used to be written by hand.
              - Built a Microsoft Teams button with Power Automate that activates and deactivates users in the portfolio management system, a manual task done 5 to 10 times a day.

      - company: "Danske Bank"
        companyUrl: "https://danskebank.com"
        jobs:
          - name: "Data Analyst (Tech Lead), Group Treasury"
            date: "Mar 2026 - May 2026"
            content: |
              - Trained 45+ non-technical colleagues in Git, VS Code, Python and AI tools, and made the tools part of the department's daily work.
              - Built a closed-loop agent workflow in GitHub Copilot that migrates legacy SAS code to Python. It fetches test data, checks that the outputs match and flags data drift.
              - Primary technical contact for Cover Pool Management: turned market risk, liquidity and debt issuance requirements into programming tasks.
          - name: "Data Scientist, Portfolio Intelligence"
            date: "Apr 2025 - Mar 2026"
            content: |
              - Taught the team GitHub Copilot, modern Python and Git practices.
              - Co-owned the migration of the bank's IFRS9 Expected Credit Loss and credit portfolio stress test models to Python on AWS, and cut their run time by 80%.
              - Presented ECL results to auditors, regulators and non-technical stakeholders.
              - Ran what-if analyses on inflation, interest rates and housing prices to test the bank's risk tolerance.

      - company: "Novo Nordisk"
        companyUrl: "https://www.novonordisk.com"
        jobs:
          - name: "Data Scientist (Student Helper), R&D"
            date: "Dec 2021 - Oct 2024"
            content: |
              - Taught the team Git, version control and deployment practices, which cut errors by 30%.
              - Profiled a Python simulation of people with type 1 diabetes and rewrote its slow parts in Cython: 60 times faster.
              - Built reproducible analysis workflows in Python on large R&D data sets, used to support decisions across cross-functional teams.
              - Wrote my master's thesis in collaboration with Novo Nordisk (see Education).

      - company: "Absis ApS"
        jobs:
          - name: "Co-founder"
            date: "2020 - 2021"
            content: |
              - Built an OCR pipeline in Python that extracts data from financial documents.

  education:
    enable: true
    index: false
    items:
      - title: "MSc Human-Centered Artificial Intelligence"
        school:
          name: "Technical University of Denmark (DTU)"
          url: "https://www.dtu.dk"
        date: "2024"
        GPA: "11.3 on the Danish 12-point scale"
        content: |-
          Thesis with Novo Nordisk (grade 12): forecasting whether people with sickle cell disease will have a vaso-occlusive crisis the next day, from questionnaires, biometrics, weather and location data. AUC of 0.98, built as a production-ready model with CI/CD.

          Relevant courses: Machine Learning Operations, Time Series Analysis, User Experience in Data Science.
      - title: "BSc Artificial Intelligence and Data"
        school:
          name: "Technical University of Denmark (DTU)"
          url: "https://www.dtu.dk"
        date: "2022"
        GPA: "10.7 on the Danish 12-point scale"
        content: |-
          Bachelor project (grade 12): a CycleGAN that removes field strength bias in an MRI-based Alzheimer's disease classifier.

          Relevant courses: Algorithms and Data Structures, Software Engineering, Probability and Statistics, Database Engineering, Deep Learning.

  achievements:
    enable: false

  # Project cards come from the pages in content/projects/.
  projects:
    enable: true
    title: "Projects"

  contact:
    enable: true
    content: "Questions about a project, or want to talk about AI in finance teams? Email me, or find me on [LinkedIn](https://www.linkedin.com/in/andershenriksen/)."
    btnName: "Mail me"
    btnLink: "mailto:anhenr.dev@gmail.com"

  footer:
    # Off while there is one post: it would repeat the Blog page.
    recentPosts:
      path: "blogs"
      count: 3
      title: "Recent Posts"
      enable: false
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/AndersHenriksen-dev
      linkedin: https://www.linkedin.com/in/andershenriksen/

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: false

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
