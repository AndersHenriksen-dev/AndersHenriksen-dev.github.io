# Bootstrap, Font Awesome and Viewer.js are vendored, minified files from the theme: leave them byte for byte.
exclude: ^static/(bootstrap-5|fontawesome-6|viewer)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        name: normalize line endings to LF
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secrets, blocking)
